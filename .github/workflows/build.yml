name: Construir imagen Gaussian Mesh

# Se ejecuta cuando tú aprietes el botón "Run workflow" en GitHub
# (manual, para que no se construya solo cada vez que subes algo)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── Paso 1: liberar espacio en el runner de GitHub ──
      # La imagen pytorch+cuda + compilar OpenMVS necesita mucho disco.
      # El runner trae ~14GB libres; esto sube a ~40GB borrando cosas
      # preinstaladas que no usamos (Android SDK, .NET, etc).
      - name: Liberar espacio en disco
        run: |
          echo "Espacio antes:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "Espacio después:"
          df -h /

      # ── Paso 2: descargar tu repositorio (con el Dockerfile) ──
      - name: Bajar el código
        uses: actions/checkout@v4

      # ── Paso 3: preparar el constructor de imágenes ──
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Paso 4: iniciar sesión en tu Docker Hub ──
      # Usa los "secrets" que tú vas a configurar en GitHub (ver instrucciones).
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Paso 5: construir la imagen y subirla ──
      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gaussian-mesh:v1
