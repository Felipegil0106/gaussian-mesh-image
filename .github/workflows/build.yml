name: Construir imagen Gaussian Mesh

# Se ejecuta cuando tú aprietes el botón "Run workflow" en GitHub
# (manual, para que no se construya solo cada vez que subes algo)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── Paso 1: liberar espacio en el runner de GitHub ──
      # La imagen pytorch+cuda + compilar OpenMVS necesita mucho disco.
      # El runner trae ~14GB libres; esto sube a ~40GB borrando cosas
      # preinstaladas que no usamos (Android SDK, .NET, etc).
      - name: Liberar espacio en disco
        run: |
          echo "Espacio antes:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "Espacio después:"
          df -h /

      # ── Paso 2: descargar tu repositorio (con el Dockerfile) ──
      - name: Bajar el código
        uses: actions/checkout@v4

      # ── Paso 3: preparar el constructor de imágenes ──
      # IMPORTANTE: por defecto buildx baja su motor 'buildkit' desde Docker Hub
      # (registry-1.docker.io), que da TIMEOUT por límites de descarga. Aquí le
      # decimos que lo baje desde el espejo de GitHub (ghcr.io), que GitHub
      # alcanza siempre y no tiene esos límites. Esto arregla el error
      # "booting buildkit ... context deadline exceeded".
      - name: Configurar Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=ghcr.io/moby/buildkit:buildx-stable-1

      # ── Paso 4: iniciar sesión en tu Docker Hub ──
      # Usa los "secrets" que tú vas a configurar en GitHub (ver instrucciones).
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Paso 5: construir la imagen y subirla ──
      # La imagen base (runpod/pytorch) también viene de Docker Hub, que a veces
      # falla. Añadimos reintentos: si el build falla por un timeout de red,
      # vuelve a intentarlo automáticamente hasta 3 veces antes de rendirse.
      - name: Construir y subir la imagen (con reintentos)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            docker buildx build \
              --builder ${{ steps.buildx.outputs.name }} \
              --file ./Dockerfile \
              --tag ${{ secrets.DOCKERHUB_USERNAME }}/gaussian-mesh:v2 \
              --push \
              .
